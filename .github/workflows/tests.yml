name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run catches changes in qa-commerce-lab even when this repository does not change.
    - cron: '47 3 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Selenium + Cucumber against the lab (Docker + Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tests
        uses: actions/checkout@v7

      # A branch or pull request tests the lab branch with the same name, if it exists,
      # so new scenarios and the lab changes they need can be developed together. Everything else tests main.
      - name: Choose the lab version to test
        id: lab
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ] && git ls-remote --exit-code --heads https://github.com/TomasevicJovan/qa-commerce-lab.git "$BRANCH" > /dev/null; then
            ref="$BRANCH"
          else
            ref="main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing qa-commerce-lab at: $ref"

      - name: Check out qa-commerce-lab
        uses: actions/checkout@v7
        with:
          repository: TomasevicJovan/qa-commerce-lab
          path: lab
          ref: ${{ steps.lab.outputs.ref }}

      - name: Start the lab with fresh data
        working-directory: lab
        run: docker compose up --build -d --wait --wait-timeout 240

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run scenarios
        env:
          # Seeded demo account of the lab. Stored as repository secrets, never in the code.
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # Set TEST_SEED as a repository variable to replay the random data of an earlier run.
          TEST_SEED: ${{ vars.TEST_SEED }}
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Lab logs
        if: failure()
        working-directory: lab
        run: docker compose logs --no-color --tail 200

      - name: Upload report and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: |
            target/cucumber-report/
            target/surefire-reports/
          retention-days: 14

      - name: Prepare report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/cucumber-report/

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    # Publish failing runs too: a red report is the one people need to read.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
