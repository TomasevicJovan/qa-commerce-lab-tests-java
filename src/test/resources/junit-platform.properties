cucumber.glue=io.github.tomasevicjovan.qacommercelab
cucumber.plugin=pretty, summary, html:target/cucumber-report/index.html
cucumber.publish.quiet=true

# Scenarios run in parallel: every scenario has its own customer and browser.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Scenarios tagged @serial change global lab switches (for example, the bank declines every payment).
# They take the global lock, so they run alone and no other scenario sees their settings.
cucumber.execution.exclusive-resources.serial.read-write=org.junit.platform.engine.support.hierarchical.ExclusiveResource.GLOBAL_KEY
